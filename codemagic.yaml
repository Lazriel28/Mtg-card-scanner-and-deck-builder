# Codemagic CI for MTG Codex
# This pipeline first runs the web app's engine tests, then builds the native
# iOS app shell from mtg-codex/ios/MTGCodex.xcodeproj. If the tests fail, the
# whole run fails and the iOS build never starts.
#
# The bundle identifier is com.mtgcodex.app.

workdir: "."

workflows:
  build_ios:
    name: Build MTG Codex iOS
    scripts:
      # Run the web app's engine tests first. If they fail, the whole run fails
      # and the iOS build never starts — gating the iOS build on the web app's
      # catalog/collection/decks/suggest logic passing.
      - name: Run node tests
        script: |
          cd mtg-codex
          node --version
          echo '--- catalog tests ---'
          node test/catalog.test.js
          echo '--- engine tests ---'
          node test/engines.test.js

      # Build the native iOS app shell from the Xcode project. Runs only after
      # the node tests above pass. Simulator build requires no signing; the
      # device build is best-effort here (signing is configured later in
      # Codemagic's iOS app settings when you set an Apple team).
      - name: Build iOS app
        script: |
          set -o pipefail
          cd mtg-codex/ios
          xcodebuild build \
            -project MTGCodex.xcodeproj \
            -scheme MTGCodex \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Also attempt a device build; signing is handled by Codemagic's
          # iOS app settings when you link the repo and set a team.
          xcodebuild build \
            -project MTGCodex.xcodeproj \
            -scheme MTGCodex \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES || true
    artifacts:
      - "mtg-codex/ios/build/Build/Products/Debug-iphonesimulator/MTGCodex.app"
      - "mtg-codex/ios/build/Build/Products/Debug-iphoneos/MTGCodex.app"
