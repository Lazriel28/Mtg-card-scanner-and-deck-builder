<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WorldForge harness</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="brand">◆</div>
    <button class="rail-btn active" data-view="world" aria-label="World (3D graph)">🌐</button>
    <button class="rail-btn" data-view="cards" aria-label="MTG workshop">🃏</button>
    <button class="rail-btn" data-view="maps" aria-label="Maps (coming later)" disabled>🗺️</button>
    <button class="rail-btn" data-view="publish" aria-label="Publish (coming later)" disabled>📖</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="btn-manual" title="Field manual" aria-label="Field manual (help)">❓</button>
    <button class="rail-btn" id="btn-vault" aria-label="Choose vault folder">📂</button>
  </nav>
  <main id="main">
    <section id="view-world" class="view active">
      <div class="world-hud">
        <input id="search" placeholder="Search notes…" aria-label="Search notes" autocomplete="off">
        <button id="btn-new" class="hud-btn">＋ Note</button>
        <button id="btn-import" class="hud-btn">📥 Import</button>
        <button id="btn-mass-delete" class="hud-btn" title="Delete many notes at once (goes to .trash, recoverable)">🗑 Mass delete</button>
        <button id="btn-graph-settings" class="hud-btn" title="Graph settings">⚙</button>
        <span id="vault-label" class="muted"></span>
      </div>
      <div id="new-note-bar" class="hidden">
        <input id="nn-title" placeholder="Note title…" autocomplete="off">
        <select id="nn-type">
          <option value="">— type —</option>
          <option>Character</option>
          <option>Location</option>
          <option>Item</option>
          <option>Lore</option>
        </select>
        <input id="nn-folder" list="nn-folders" placeholder="folder (optional)">
        <datalist id="nn-folders"></datalist>
        <button id="nn-create">Create</button>
        <button id="nn-cancel" title="Cancel">✕</button>
      </div>
      <div id="graph-settings" class="hidden">
        <div class="gs-title">Graph settings <button id="gs-close">✕</button></div>
        <div class="gs-row"><label for="gs-size">Node size</label><input id="gs-size" type="range" min="0.4" max="2.5" step="0.05"><span class="gs-val" id="gs-size-val"></span></div>
        <div class="gs-row"><label for="gs-rest">Link distance</label><input id="gs-rest" type="range" min="5" max="40" step="1"><span class="gs-val" id="gs-rest-val"></span></div>
        <div class="gs-row"><label for="gs-rep">Repel force</label><input id="gs-rep" type="range" min="200" max="4000" step="50"><span class="gs-val" id="gs-rep-val"></span></div>
        <div class="gs-sep"></div>
        <div class="gs-title2">Show</div>
        <div class="gs-chips">
          <button class="cat-chip" data-type="character">Character</button>
 <button class="cat-chip" data-type="location">Location</button>
          <button class="cat-chip" data-type="item">Item</button>
          <button class="cat-chip" data-type="lore">Lore</button>
          <button class="cat-chip" data-type="untyped">Untyped</button>
          <button class="cat-chip orphan" data-orphans="1">Orphans</button>
        </div>
        <div class="gs-hint">Sliders re-layout · chips hide categories · orphans = unlinked notes</div>
      </div>
      <div id="scene"></div>
      <div id="tooltip"></div>
    </section>
    <section id="view-cards" class="view">
      <div class="mtg-wrap">
        <div class="mtg-tabs">
          <button class="mtg-tab active" data-mtg-tab="collection">📁 Collection</button>
          <button class="mtg-tab" data-mtg-tab="deck">🧠 Deck builder</button>
          <button class="mtg-tab" data-mtg-tab="battlefield">⚔️ Playground</button>
        </div>

        <div class="mtg-pane active" id="mtg-pane-collection">
          <div class="mtg-searchbar">
            <input id="mtg-q" placeholder="Find a card… (type, then Enter to add to collection)" aria-label="Find a Magic card" autocomplete="off">
            <div id="mtg-ac" class="mtg-ac hidden"></div>
          </div>
          <div id="mtg-card-info" class="mtg-card-info hidden"></div>
          <div class="mtg-importrow">
            <textarea id="mtg-paste" rows="3" aria-label="Paste a decklist, one card per line" placeholder="Paste a decklist, one card per line — “4x Lightning Bolt”, “2 Counterspell (LTR) 38” — and I'll read it"></textarea>
            <button id="mtg-paste-add">Add list</button>
            <span id="mtg-paste-status" class="muted" aria-live="polite"></span>
          </div>
          <div class="mtg-coll-head"><b id="mtg-coll-count">0</b><span class="muted"> cards in your collection (stored locally)</span></div>
          <div id="mtg-coll" class="mtg-coll"></div>
        </div>

        <div class="mtg-pane" id="mtg-pane-deck">
          <div class="mtg-deckbar">
            <select id="mtg-d-colors" title="Deck colors" aria-label="Deck colors">
              <option value="">🎯 Auto — learned from you</option>
              <option value="W">White</option><option value="U">Blue</option>
              <option value="B">Black</option><option value="R">Red</option>
              <option value="G">Green</option><option value="C">Colorless</option>
            </select>
            <select id="mtg-d-size" title="Deck size" aria-label="Deck size">
              <option value="100">100 — Commander</option>
              <option value="60">60 — Standard</option>
              <option value="40">40 — Sealed</option>
            </select>
            <button id="mtg-d-build">Build me a deck</button>
          </div>
          <div id="mtg-d-out"></div>
        </div>

        <div class="mtg-pane" id="mtg-pane-battlefield">
          <div class="mtg-playbar">
            <span class="mtg-life-group" aria-label="Life total"><button id="mtg-life-minus" aria-label="Decrease life">−</button><span id="mtg-life" aria-live="polite">20</span><button id="mtg-life-plus" aria-label="Increase life">＋</button></span>
            <button id="mtg-d20" aria-label="Roll a twenty-sided die">🎲 d20</button>
            <button id="mtg-coin" aria-label="Flip a coin">🪙 Coin</button>
            <input id="mtg-bf-add" placeholder="put a card on the battlefield…" aria-label="Add a card to the battlefield" autocomplete="off">
            <div id="mtg-bf-ac" class="mtg-ac hidden"></div>
          </div>
          <div id="mtg-bf-result" class="mtg-bf-result" role="status"></div>
          <div id="mtg-battlefield"></div>
        </div>
      </div>
    </section>
    <section id="view-maps" class="view"><p class="muted pad">Maps arrive in M3.</p></section>
    <section id="view-publish" class="view"><p class="muted pad">Publish arrives in M4.</p></section>
  </main>
  <aside id="note-panel" class="hidden">
    <div class="np-head">
      <div><div id="np-crumb" class="crumb"></div><h2 id="np-title"></h2></div>
      <div class="np-actions"><button id="np-edit">Edit</button><button id="np-close">✕</button></div>
    </div>
    <div id="np-tags" class="tags"></div>
    <div id="np-body" class="np-body"></div>
    <textarea id="np-raw" class="hidden" spellcheck="false"></textarea>
    <div id="np-savebar" class="hidden"><span class="muted">Ctrl+S saves</span><button id="np-save">Save</button></div>
    <div id="np-links"></div>
  </aside>
</div>
<div id="mass-delete-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="md-title">
  <div class="md-box">
    <div class="md-head">
      <h2 id="md-title">🗑 Mass delete</h2>
      <button id="md-close" aria-label="Close mass delete">✕</button>
    </div>
    <div class="md-toolbar">
      <input id="md-filter" placeholder="Filter notes…" aria-label="Filter notes by title" autocomplete="off">
      <button id="md-dupes" title="Select every note whose title appears more than once (e.g. Note 2 from re-imports)">Select duplicates</button>
      <span id="md-count" class="muted" aria-live="polite">0 selected</span>
    </div>
    <div id="md-list" class="md-list" role="list"></div>
    <div class="md-foot">
      <span class="muted">Deleted notes go to your vault's <code>.trash/</code> — recoverable.</span>
      <button id="md-delete" class="danger" disabled>Delete selected</button>
    </div>
  </div>
</div>
<div id="manual-overlay" class="hidden"><iframe id="manual-frame" src="about:blank"></iframe><button id="manual-close" title="Close (Esc)">✕</button></div>
<script src="vendor/three.min.js"></script>
<script>
// Tiny MTG fixture index for the harness (same compact shape as mtg-cards.json).
function mtgMock() {
  const CARDS = [
    { n: 'Lightning Bolt', mc: '{R}', c: 1, col: ['R'], t: 'Instant', o: 'Deals 3 damage to any target.', kw: [], im: null, _cn: undefined },
    { n: 'Counterspell', mc: '{U}{U}', c: 2, col: ['U'], t: 'Instant', o: 'Counter target spell.', kw: [], im: null, _cn: undefined },
    { n: 'Countersquall', mc: '{U}{B}', c: 2, col: ['U','B'], t: 'Instant', o: 'Counter target spell. Its controller loses 2 life.', kw: [], im: null, _cn: undefined },
    { n: 'Serra Angel', mc: '{3}{W}{W}', c: 5, col: ['W'], t: 'Creature — Angel', o: 'Vigilance, flying', kw: ['Flying','Vigilance'], pt: '4/4', im: null, _cn: undefined },
    { n: 'Divination', mc: '{2}{U}', c: 3, col: ['U'], t: 'Sorcery', o: 'Draw two cards.', kw: [], im: null, _cn: undefined },
    { n: 'Mountain', mc: '', c: 0, col: [], t: 'Basic Land — Mountain', o: '', kw: [], im: null, _cn: undefined },
    { n: 'Island', mc: '', c: 0, col: [], t: 'Basic Land — Island', o: '', kw: [], im: null, _cn: undefined },
  ];
  const view = c => c && ({ name: c.n, mana: c.mc, cmc: c.c, colors: c.col, type: c.t, text: c.o, keywords: c.kw, pt: c.pt, image: c.im, faces: c._cn });
  const find = n => CARDS.find(c => c.n.toLowerCase() === String(n).toLowerCase());
  const ls = { get: () => { try { return JSON.parse(localStorage.wfMockColl || '{}'); } catch { return {}; } }, set: o => { localStorage.wfMockColl = JSON.stringify(o); } };
  return {
    mtgSearch: async q => { const s = q.toLowerCase(); return { ok: true, data: CARDS.filter(c => c.n.toLowerCase().includes(s)).slice(0, 12).map(view) }; },
    mtgCard: async n => ({ ok: true, data: view(find(n)) }),
    mtgCollection: async () => ({ ok: true, data: Object.entries(ls.get()).map(([n, qty]) => ({ ...view(find(n)), qty })).filter(c => c.name) }),
    mtgCollectionAdd: async lines => {
      const coll = ls.get(); const added = [], skipped = [];
      for (const line of lines) {
        const m = line.trim().match(/^(\d+)\s*[xX]?\s+(.*)$/) || [null, 1, line.trim()];
        const qty = parseInt(m[1], 10) || 1, name = m[2];
        if (find(name)) { coll[name] = (coll[name] || 0) + qty; added.push(name); } else skipped.push(name);
      }
      ls.set(coll); return { ok: true, data: { added, skipped } };
    },
    mtgCollectionSet: async (n, qty) => { const c = ls.get(); if (qty <= 0) delete c[n]; else c[n] = qty; ls.set(c); return { ok: true, data: c }; },
    mtgSuggestDeck: async opts => {
      const coll = ls.get(); const size = (opts && opts.size) || 100;
      const deck = Object.entries(coll).map(([n, qty]) => ({ ...view(find(n)), qty: Math.min(qty, 4) })).filter(c => c.name);
      const total = deck.reduce((a, d) => a + d.qty, 0);
      return { ok: true, data: { colors: ['U'], size: total, deck, curve: { 0: 0, 1: 4, 2: 6, 3: 4, 4: 2, '5+': 1 }, notes: total < size ? [`collection covers ${total} of ${size} — harness fixture`] : [] } };
    },
    mtgCounters: async () => ({ ok: true, data: { colors: ['U'], creatureCount: 4, avgCmc: 2.6, threats: [{ name: 'Serra Angel', score: 9 }], weaknesses: ['Creature-heavy — board wipes clear the board'], counters: [{ name: 'Wrath of God', qty: 2, why: 'board wipe — resets their creatures', mana: '{2}{W}{W}', cmc: 4, colors: ['W'], type: 'Sorcery' }] } }),
  };
}
</script>
<script>
// ---- window.wf mock backed by harness-data.json ----
(async function () {
  const data = await fetch('harness-data.json').then(r => r.json());
  window.wf = {
    status: async () => ({ loaded: true, root: data.root, notes: data.graph.nodes.length }),
    pickVault: async () => null,
    loadVault: async () => {},
    graph: async () => data.graph,
    note: async (id) => data.notes[id],
    saveNote: async (id, raw) => { data.notes[id].raw = raw; },
    pickImport: async () => null,
    importNotes: async () => ({ imported: 0, skipped: 0, dest: 'imports' }),
    noteTitles: async () => Object.keys(data.notes).map(id => ({ id, title: data.notes[id].title })),
    setType: async (id, type) => { if (data.notes[id]) data.notes[id].type = (type || 'untyped').toLowerCase(); const nd = data.graph.nodes.find(n => n.id === id); if (nd) nd.type = (type || 'untyped').toLowerCase(); return { ok: true }; },
    copyText: async t => { window.__lastCopy = t; return { ok: true }; },
    deleteNotes: async ids => { let n = 0; for (const id of ids) { if (data.notes[id]) { delete data.notes[id]; n++; } } data.graph.nodes = data.graph.nodes.filter(x => !ids.includes(x.id)); return { ok: true, deleted: n, missing: [] }; },
    deleteNote: async id => { delete data.notes[id]; data.graph.nodes = data.graph.nodes.filter(n => n.id !== id); return { ok: true }; },
    createNote: async (title, folder, type) => {
      const rel = (folder ? folder + '/' : '') + title + '.md';
      data.notes[rel] = { id: rel, title, dir: folder || '.', type: (type || '').toLowerCase() || 'untyped', raw: (type ? '---\ntype: ' + type + '\n---\n\n' : '') + '# ' + title + '\n\n', html: '<h1>' + title + '</h1>', outgoing: [], backlinks: [] };
      data.graph.nodes.push({ id: rel, title, dir: folder || '.', type: (type || '').toLowerCase() || 'untyped', tags: [], size: 10, mtime: 0 });
      return { ok: true, id: rel };
    },
    openPath: async () => {},
    // ---- MTG mock: tiny inline index + localStorage collection ----
    ...(mtgMock()),
  };
  const V = 'tomb1';
  const s = document.createElement('script');
  s.src = 'vendor/three.min.js';
  s.onload = () => {
    const w = document.createElement('script');
    w.src = 'world.js?v=' + V;
    w.onload = () => { const a = document.createElement('script'); a.src = 'app.js?v=' + V; document.body.appendChild(a); };
    document.body.appendChild(w);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
